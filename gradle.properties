# Gradle 属性（常规配置）
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# ── JDK 要求：AGP 9.4 / Gradle 9.7 需要 JDK 17 以上；
#    本工程 Java/Kotlin 目标字节码为 21（miuix-nav 0.9.5 的 class 目标是 21）。
#    请用 JDK 21（或更高）运行 Gradle，不要在仓库里写死本机 JDK 路径，
#    需要时在自己的 ~/.gradle/gradle.properties 里配 org.gradle.java.home。
#
# AGP 9.4.0 内置 Kotlin（built_in_kotlinc）与自定义 Kotlin 目录混编断：
# compileDebugJavaWithJavac 拿不到 Kotlin 产物（Java 报「程序包 EventLog 不存在」）。
# 官方退路 = 关闭内置 Kotlin、恢复 org.jetbrains.kotlin.android 插件。
# 该开关 AGP 10 移除，届时需重估（migrate-to-built-in-kotlin 官方文档口径）。
android.builtInKotlin=false
# kotlin-android 插件与 AGP 9 新 DSL 不兼容（报错原文给出的临时 bypass），
# 与 builtInKotlin=false 配套；两者均 AGP 10 移除，届时需重估
android.newDsl=false
