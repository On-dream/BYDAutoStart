# BYDHooker 正式模块 · 版本目录（唯一版本来源）
#
# 口径（T01 / 00 §6 裁定 / maven_versions.md）：
#   - 只写**已核实值**：miuix 0.9.4、libxposed api 102.0.0
#   - 未核实项一律 `<version>` 占位并标【不知道】，**0 处编造版本号**
#   - 本骨架本轮**不执行 Gradle assemble**（占位版本无法解析），待回拍板锁定后再跑
#   - 详细复核证据见 research/P1前置验证/offline/maven_versions.md

[versions]

# ---- 已核实（【官方文档】Maven Central 实测，2026-11-08）----
# 【2026-11-21 升级：0.9.4 → 0.9.5-beta02】用户要求「适配最新的 beta 版 miuix」。
# Maven Central 直连本机 403，改查阿里云镜像 metadata（实测 2026-11-21）：
#   miuix-ui-android / preference / icons / blur / material / nav / glass / squircle
#   → <latest>0.9.5-beta02</latest> <release>0.9.5-beta02</release>
#   <lastUpdated>20261120063828</lastUpdated>（= 该版本为当前最新发布，无更新 beta）
# 各构件 pom+aar 均实测 HTTP 200（aliyun central 镜像）。
#
# 0.9.5-beta01 起的关键变化（GitHub release 正文实测）：
#   · 新增 miuix-glass / miuix-glass-icons 模块（OS4 玻璃材质移植）：
#     GlassSurface/GlassPanel/GlassTopAppBar/GlassNavigationBar/GlassDialog/
#     GlassDropdownPreference/GlassTabRow/GlassIconButton/GlassPopup 等；
#   · 新增 miuix-material（替代 miuix-shader）：GlassStyle(s)/GlassMaterial(s)/
#     GlassShape/GlassShadow/EdgeStroke；
#   · 破坏性：miuix-shader 移除、PagerGestureUtils 的 iOS-like 拦截模式移除。
#     本项目未使用 miuix-shader；`springAnimateToPage` 反编译确认**仍在**
#     （PagerGestureUtilsKt$springAnimateToPage$2），故无需改切页代码。
#
# 【不写死猜测值】版本号取自镜像 metadata 实读，非记忆。
miuix = "0.9.5-beta02"

# https://repo1.maven.org/maven2/io/github/libxposed/api/102.0.0/api-102.0.0.aar  HTTP 200, 30582 B
# maven-metadata.xml: <latest>102.0.0</latest> <release>102.0.0</release>
libxposedApi = "102.0.0"

# ---- 裁定 H + 用户 17:4x 拍板（2026-11-08，兼容矩阵官方文档核对）----
# service:102.0.1 —— Maven Central 实测 HTTP 404（上游缺陷：102.0.0 AAR 缺 AIDL 生成类，
#   102.0.1 为修复版本但未发布成功）→ **裁定 H 改用 102.0.0**（存在性已复核 HTTP 200），
#   探针以精简 AIDL（34 版 aidl）自生成 Stub 补齐（06 §9.2、07）。
libxposedService = "102.0.0"

# 兼容矩阵（2026-11-08 复核，权威源：Android 官方 AGP/Gradle 表 + Gradle versions API + Kotlin 官方）：
#   AGP → 最低 Gradle：9.4→9.6.0 / 9.3→9.5.0 / 9.2→9.4.1 / 9.1→9.3.1 / 9.0→9.1.0
#     （旧交接误记「9.5.0 从未发布」—— 经 Gradle versions API 核实 9.5.0 已正式发布，故 9.3/9.4 可用）
#   KGP 2.4.20–2.4.21：Gradle 7.6.3–9.7.0、AGP 8.5.2–9.3.1+ ✅（2.4.21 为 2.4.x 最新稳定）
#   选定组合：AGP 9.4.0 + Gradle 9.7.0（≤ Kotlin 上限 9.7.0，且 ≥ AGP 9.4 要求的 9.6.0）+ Kotlin 2.4.21
#   混编绕行（AGP 9 内置 Kotlin 对自定义 Kotlin 目录 classpath 断）：android.builtInKotlin=false + newDsl=false
#   miuix 0.9.4 = Kotlin 2.4.20 + Compose 1.12.0 构建（Gradle metadata 实测），故 Kotlin 锁 2.4.x
agp = "9.4.0"
kotlin = "2.4.21"
gradleWrapper = "9.7.0"
# composeCompiler：T04 引入 miuix/Compose 时锁定（本批 T03 构建**不含 Compose**）

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Compose Compiler 插件（miuix 为 Compose Multiplatform；T04 UI 落地时于 app/build.gradle.kts
#   用 alias(libs.plugins.kotlinCompose) 启用）：id 已核实 = org.jetbrains.kotlin.plugin.compose，
#   版本与 kotlin 对齐（2.4.21）。T03 源码未引用 Compose，暂不启用，故未 alias 进 app。
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# miuix-nav 的路由 key 必须 @Serializable（官方 muiix-nav.md：「A persisted stack uses
# kotlinx.serialization, so annotate the complete route hierarchy and every concrete route
# key with @Serializable」，且「The consumer project must also enable the Kotlin Serialization
# compiler plugin」）。版本与 Kotlin 对齐 2.4.21，不引入第二个 Kotlin 版本。
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

[libraries]
# ---- 已核实坐标 ----
# androidx activity-ktx（设置页 ComponentActivity 宿主）
#
# 【2026-11-21 升级 1.7.0 → 1.13.0 —— 这是 GlassDialog 闪退的**真正修复点**】
# 现象：点开 GlassDialog 立刻崩溃：
#   java.lang.IllegalStateException: No NavigationEventDispatcher was provided
#   via LocalNavigationEventDispatcherOwner（真机 logcat 实抓，非推测）
# 根因：miuix 0.9.5 的 Overlay 类弹窗（GlassDialog / GlassDropdownPreference）
#   依赖 androidx.navigationevent 的 NavigationBackHandler，需要 Composition 里有
#   LocalNavigationEventDispatcherOwner。该值由 AbstractComposeView 从
#   ViewTreeNavigationEventDispatcherOwner 自动注入，而**只有实现了
#   NavigationEventDispatcherOwner 的 Activity 才会提供它**。
# 实证：javap 反编译 activity-1.13.0.aar 的 ComponentActivity，接口列表里含
#   `androidx.navigationevent.NavigationEventDispatcherOwner`（1.7.0 没有）。
# 所以升到 1.13.0（当前稳定版；latest 1.14.0-alpha03 不用，避免 alpha）。
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version = "1.13.0" }

# zxing core（纯 Java 二维码编码；用户 2026-11-08 21:11 拍板引入，仅设置页出码用）
zxing-core = { module = "com.google.zxing:core", version = "3.5.3" }

libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "libxposedApi" }
miuix-ui-android = { group = "top.yukonga.miuix.kmp", name = "miuix-ui-android", version.ref = "miuix" }
miuix-preference-android = { group = "top.yukonga.miuix.kmp", name = "miuix-preference-android", version.ref = "miuix" }
# 2026-11-09（Step 2G）：官方扩展图标集 —— 提供 Settings（齿轮）等 basic 集没有的图标。
# 【已核实】坐标与 0.9.4 均实测可达：
#   aliyun public → HTTP 200（pom）；.module 实读确认依赖链仅 miuix-core 0.9.4 + kotlin-stdlib。
#   注：Maven Central 直连本机返回 403（IP 被限流），故 settings.gradle.kts 已加镜像优先。
miuix-icons-android = { group = "top.yukonga.miuix.kmp", name = "miuix-icons-android", version.ref = "miuix" }

# ---- 0.9.5-beta02 新增（2026-11-21 分支 feature/miuix-0.9.5b-glass）----
# miuix-glass：玻璃组件集。pom 实读传递依赖 = miuix-blur + miuix-material + miuix-ui
#   （均 0.9.5-beta02）+ foundation-android 1.13.0-rc01 + navigationevent-compose 1.2.0。
#   ⚠️ miuix-blur 的 AndroidManifest 声明 minSdkVersion=33，本工程 minSdk=26
#   ⇒ 必须在 app/AndroidManifest.xml 加 tools:overrideLibrary（已加，见该文件注释）。
miuix-glass-android = { group = "top.yukonga.miuix.kmp", name = "miuix-glass-android", version.ref = "miuix" }
# miuix-nav：真二级页导航（rememberNavBackStack / NavDisplay / NavTransitions）。
#   独立模块，不依赖 miuix-ui（官方 skill source-verification.md 口径）。
miuix-nav-android = { group = "top.yukonga.miuix.kmp", name = "miuix-nav-android", version.ref = "miuix" }
# kotlinx-serialization-json：miuix-nav 路由栈的序列化底座。
# 【已核实】版本取自 miuix-nav-android-0.9.5-beta02.pom 实读的 runtime 依赖
#   org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.13.0 —— 不凭记忆写版本号。
# 为什么还要显式声明：pom 里它是 runtime scope，而 `@Serializable` 注解在**编译期**就要解析，
# 显式 implementation 保证编译类路径上有它（否则报 Unresolved reference Serializable）。
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version = "1.13.0" }

# androidx.navigationevent:compose —— 显式注入 NavigationEventDispatcherOwner 用
# （GlassDialog/GlassDropdownPreference 依赖它的 NavigationBackHandler）。
# 【已核实】版本取自 miuix-ui-android-0.9.5-beta02.pom 的 runtime 依赖实读值 1.2.0。
# 为什么必须显式声明：miuix 只把它声明成 **runtime** scope，
# 编译期类路径看不到 → `rememberNavigationEventDispatcherOwner` 报 Unresolved reference。
navigationevent-compose = { module = "androidx.navigationevent:navigationevent-compose", version = "1.2.0" }

# ---- 待回拍板坐标（版本占位，不得写死）----
libxposed-service = { group = "io.github.libxposed", name = "service", version.ref = "libxposedService" }
